crons:
  - name: weekly-report
    description: "Invia all'admin il report settimanale dei coupon riscattati per locale, lunedì alle 8 UTC"
    # Day-of-week is numeric 0-6 with 0=Sunday, so Monday is 1.
    cron: "0 8 * * 1"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-report"
    method: POST
    enabled: true
